name: Secret scanning

on:
  pull_request:
  push:
    branches: ["main"]
  schedule:
    - cron: '51 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the tested ref and its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks binary
        env:
          GL_VERSION: 8.30.1
          GL_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz"
          echo "${GL_SHA256}  gitleaks.tar.gz" | sha256sum --check -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          ./gitleaks version
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan new commits or audit full history
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              sh .github/scripts/secret-scan.sh range "$PR_BASE_SHA" "$PR_HEAD_SHA"
              ;;
            push)
              case "$PUSH_BEFORE_SHA" in
                ''|0000000000000000000000000000000000000000)
                  sh .github/scripts/secret-scan.sh history
                  ;;
                *)
                  sh .github/scripts/secret-scan.sh range "$PUSH_BEFORE_SHA" "$PUSH_AFTER_SHA"
                  ;;
              esac
              ;;
            *)
              sh .github/scripts/secret-scan.sh history
              ;;
          esac
